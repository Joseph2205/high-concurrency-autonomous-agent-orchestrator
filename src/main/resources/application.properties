spring.application.name=high-concurrency-agent-orchestrator
spring.threads.virtual.enabled=true

orchestrator.node-id=node-1
orchestrator.grpc.port=9090
orchestrator.grpc.enabled=true
# Shared secret for agent registration; empty disables the check (dev only).
orchestrator.security.registration-token=
# memory = local map, redis = shared orchestrator:agents hash (multi-node).
orchestrator.registry.mode=memory

# Optional fake-agent load simulator (disabled by default).
orchestrator.simulator.enabled=false
orchestrator.simulator.agent-count=100
orchestrator.simulator.max-submissions-per-agent=3
orchestrator.simulator.base-url=http://localhost:8080

# Resilience4j thresholds for outbound calls to third-party agent APIs.
orchestrator.resilience.failure-rate-threshold=50
orchestrator.resilience.sliding-window-size=10
orchestrator.resilience.minimum-number-of-calls=5
orchestrator.resilience.permitted-calls-in-half-open-state=3
orchestrator.resilience.wait-duration-in-open-state=10s
orchestrator.resilience.max-bulkhead-concurrent-calls=50
orchestrator.resilience.max-bulkhead-wait=500ms
orchestrator.resilience.max-retry-attempts=2
orchestrator.resilience.retry-wait-duration=200ms
orchestrator.resilience.call-timeout=2s
