name: Java CI

on:
  push:
    branches:
      - main
      - "feature/**"
      - "fix/**"
      - "integration/**"

  pull_request:
    branches:
      - main
      - integration

  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-and-test:
    name: Build and Test
    runs-on: ubuntu-latest

    services:
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven

      - name: Make Maven Wrapper executable
        run: chmod +x mvnw

      - name: Compile application
        run: ./mvnw -B -DskipTests compile

      - name: Check Redis connection
        run: |
          docker ps
          docker run --rm --network host redis:7-alpine redis-cli -h localhost -p 6379 ping

  

  - name: Run tests
    env:
      SPRING_DATA_REDIS_HOST: localhost
      SPRING_DATA_REDIS_PORT: "6379"
      ORCHESTRATOR_REGISTRY_MODE: redis
    run: ./mvnw -B verify

