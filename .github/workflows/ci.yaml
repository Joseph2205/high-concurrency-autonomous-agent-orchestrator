
name: Java CI

on:
  push:
    branches:
      - main
      - "feature/**"
      - "fix/**"
      - "integration/**"

  pull_request:
    branches:
      - main
      - integration

  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-and-test:
    name: Build and Test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven

      - name: Make Maven Wrapper executable
        run: chmod +x mvnw

      - name: Compile application
        run: ./mvnw -B -DskipTests compile

      - name: Run tests
        run: ./mvnw -B verify

